name: CI

# 문서만 바뀐 커밋에서는 돌리지 않는다. 허용 목록(paths)이 아니라 제외 목록을 쓰는 이유는,
# 새 코드 디렉터리가 생겼을 때 조용히 검사에서 빠지는 쪽보다 문서에서 한 번 더 도는 쪽이
# 안전하기 때문이다. GitHub Actions는 YAML 앵커를 지원하지 않아 두 곳에 같은 목록을 쓴다.
on:
  push:
    branches: [develop, main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    branches: [develop, main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"

jobs:
  test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: "stable"
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Create firebase options stubs
        run: |
          STUB='import "package:firebase_core/firebase_core.dart" show FirebaseOptions;
          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform => throw UnsupportedError("CI stub");
            static const FirebaseOptions android = FirebaseOptions(apiKey:"ci",appId:"ci",messagingSenderId:"ci",projectId:"ci");
            static const FirebaseOptions ios = FirebaseOptions(apiKey:"ci",appId:"ci",messagingSenderId:"ci",projectId:"ci",iosBundleId:"ci");
          }'
          echo "$STUB" > lib/firebase_options_dev.dart
          echo "$STUB" > lib/firebase_options_prod.dart

      - name: Analyze
        run: dart analyze

      - name: Test
        run: flutter test

  functions:
    name: Functions & Rules
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci
        working-directory: functions

      - name: Unit tests
        run: npm run test:unit
        working-directory: functions

      - name: Rules tests
        run: npm run test:rules
        working-directory: functions
