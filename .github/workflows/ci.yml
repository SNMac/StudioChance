name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    name: Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1"
          channel: "stable"
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Create firebase options stubs
        run: |
          STUB='import "package:firebase_core/firebase_core.dart" show FirebaseOptions;
          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform => throw UnsupportedError("CI stub");
            static const FirebaseOptions android = FirebaseOptions(apiKey:"ci",appId:"ci",messagingSenderId:"ci",projectId:"ci");
            static const FirebaseOptions ios = FirebaseOptions(apiKey:"ci",appId:"ci",messagingSenderId:"ci",projectId:"ci",iosBundleId:"ci");
          }'
          echo "$STUB" > lib/firebase_options_dev.dart
          echo "$STUB" > lib/firebase_options_prod.dart

      - name: Analyze
        run: dart analyze

      - name: Test
        run: flutter test

  functions:
    name: Functions & Rules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci
        working-directory: functions

      - name: Unit tests
        run: npm run test:unit
        working-directory: functions

      - name: Rules tests
        run: npm run test:rules
        working-directory: functions
